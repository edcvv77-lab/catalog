name: Storefront quality checks
on:
  pull_request:
    paths:
      - 'public/**'
      - 'tests/storefront.test.mjs'
      - '.github/workflows/storefront-checks.yml'
  workflow_dispatch:
jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/storefront.test.mjs
