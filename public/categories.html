<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>الأقسام | متجر أم تركي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/store-shared.css">
  <style>
    .categories-page .page-hero{padding-bottom:8px}
    .categories-title-row{display:flex;align-items:end;justify-content:space-between;gap:14px}
    .all-link{font-weight:800;color:var(--g);font-size:14px}
    .category-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0 24px}
    .category-tile{background:#fff;border:1px solid var(--line);border-radius:20px;padding:12px;display:flex;align-items:center;gap:12px;min-height:104px;box-shadow:0 6px 18px rgba(31,84,47,.05);transition:.2s}
    .category-tile:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
    .category-tile.active{border-color:#9db79f;background:#f2f7ef}
    .category-thumb{width:72px;height:72px;border-radius:16px;object-fit:cover;flex:0 0 auto}
    .category-text{min-width:0}.category-text h3{margin:0 0 5px;font-size:16px}.category-text p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}.category-count{display:inline-block;margin-top:6px;font-size:11px;color:var(--g);font-weight:800}
    .section-panel{background:#fff;border:1px solid var(--line);border-radius:24px;padding:18px;margin-bottom:18px}
    .section-panel h2{margin:0 0 5px;font-size:23px}.section-panel p{margin:0;color:var(--muted);font-size:13px;line-height:1.7}
    .filter-row{display:flex;gap:8px;overflow:auto;padding:4px 0 14px;scrollbar-width:none}.filter-row::-webkit-scrollbar{display:none}.filter-chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-weight:700;color:#526056}.filter-chip.active{background:var(--g);color:#fff;border-color:var(--g)}
    .product .product-img{display:block}
    @media(max-width:800px){.category-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:650px){
      .categories-title-row{align-items:center}.categories-page .page-hero h1{font-size:24px}.categories-page .page-hero p{font-size:13px}
      .category-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px}
      .category-tile{display:block;min-height:0;padding:9px;border-radius:17px}.category-thumb{width:100%;height:92px;border-radius:13px;display:block;margin-bottom:8px}.category-text h3{font-size:14px;margin-bottom:3px}.category-text p{font-size:10.5px;line-height:1.4}.category-count{font-size:10px;margin-top:4px}
      .section-panel{padding:15px;border-radius:19px}.section-panel h2{font-size:20px}
      .products{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.product-img{height:150px}.product-body{padding:10px}.product h3{font-size:13px;line-height:1.5}.rating{font-size:10px}.price{font-size:14px;margin:6px 0 9px}.btn{font-size:12px;padding:9px 8px}
    }
  </style>
</head>
<body class="categories-page">
<header class="site-header">
  <div class="wrap header-row">
    <a class="back" href="index.html" aria-label="العودة">←</a>
    <a class="brand" href="index.html"><span class="leaf">🌿</span><span>متجر أم تركي</span></a>
    <a class="head-action" href="cart.html" aria-label="السلة">🛒<span class="badge cart-count">0</span></a>
  </div>
</header>

<main class="wrap">
  <section class="page-hero">
    <div class="categories-title-row">
      <div><h1>الأقسام</h1><p>اختاري نوع العناية، وستظهر لك المنتجات التابعة له فقط.</p></div>
      <a class="all-link" href="categories.html">عرض الكل</a>
    </div>
  </section>

  <div class="category-grid" id="categoryGrid"></div>

  <div class="section-panel">
    <h2 id="sectionTitle">كل المنتجات</h2>
    <p id="sectionDesc">تصفحي منتجات متجر أم تركي، واضغطي على أي منتج لعرض التفاصيل.</p>
  </div>

  <div class="filter-row" id="filters">
    <a class="filter-chip" data-cat="all" href="categories.html">الكل</a>
    <a class="filter-chip" data-cat="face" href="?cat=face">الوجه</a>
    <a class="filter-chip" data-cat="skin" href="?cat=skin">البشرة</a>
    <a class="filter-chip" data-cat="hair" href="?cat=hair">الشعر</a>
    <a class="filter-chip" data-cat="herbs" href="?cat=herbs">الأعشاب والخلطات</a>
  </div>

  <div class="products" id="gridProducts"></div>
</main>

<nav class="bottom">
  <a href="index.html"><span>⌂</span>الرئيسية</a>
  <a class="active" href="categories.html"><span>▦</span>الأقسام</a>
  <a href="favorites.html"><span>♡</span>المفضلة</a>
  <a href="cart.html"><span>🛒</span>السلة</a>
</nav>

<script src="../assets/store-data.js"></script>
<script>
  const categories = {
    face:{title:"العناية بالوجه",desc:"ماسكات ومنتجات روتين الوجه.",img:"https://images.unsplash.com/photo-1616394584738-fc6e612e71b9?auto=format&fit=crop&w=500&q=82"},
    skin:{title:"العناية بالبشرة",desc:"ترطيب وعناية وتفتيح.",img:"https://images.unsplash.com/photo-1620916566398-39f1143ab7be?auto=format&fit=crop&w=500&q=82"},
    hair:{title:"العناية بالشعر",desc:"زيوت وخلطات وروتين الشعر.",img:"https://images.unsplash.com/photo-1527799820374-dcf8d9d4a388?auto=format&fit=crop&w=500&q=82"},
    herbs:{title:"الأعشاب والخلطات",desc:"أعشاب وخلطات طبيعية مختارة.",img:"https://images.unsplash.com/photo-1515586000433-45406d8e6662?auto=format&fit=crop&w=500&q=82"}
  };

  const params = new URLSearchParams(location.search);
  const selected = params.get("cat") || "all";

  document.getElementById("categoryGrid").innerHTML = Object.entries(categories).map(([key,c]) => {
    const count = storeProducts.filter(p=>p.category===key).length;
    return `<a class="category-tile ${selected===key?'active':''}" href="?cat=${key}">
      <img class="category-thumb" src="${c.img}" alt="${c.title}">
      <div class="category-text">
        <h3>${c.title}</h3>
        <p>${c.desc}</p>
        <span class="category-count">${count} منتج</span>
      </div>
    </a>`;
  }).join("");

  document.querySelectorAll(".filter-chip").forEach(el => {
    el.classList.toggle("active", el.dataset.cat === selected);
  });

  if(selected !== "all" && categories[selected]){
    document.getElementById("sectionTitle").textContent = categories[selected].title;
    document.getElementById("sectionDesc").textContent = categories[selected].desc + " اختاري المنتج المناسب واضغطي عليه لعرض التفاصيل.";
  }

  const arr = storeProducts.filter(p => selected==="all" || p.category===selected);
  const fav = getFav();
  const grid = document.getElementById("gridProducts");

  grid.innerHTML = arr.length ? arr.map(p => `
    <article class="product">
      <div class="product-img">
        <a href="product.html?id=${p.id}"><img src="${p.image}" alt="${p.name}" loading="lazy"></a>
        <button class="heart ${fav.includes(p.id)?'active':''}" onclick="const active=toggleFav(${p.id});this.classList.toggle('active',active);this.textContent=active?'♥':'♡'">${fav.includes(p.id)?'♥':'♡'}</button>
      </div>
      <div class="product-body">
        <a href="product.html?id=${p.id}"><h3>${p.name}</h3></a>
        <div class="rating">★★★★★ <span>(${p.reviews})</span></div>
        <div class="price">${money(p.price)}</div>
        <button class="btn full" onclick="addToCart(${p.id});this.textContent='تمت الإضافة ✓'">أضف إلى السلة</button>
      </div>
    </article>`).join("") :
    '<div class="empty" style="grid-column:1/-1">لا توجد منتجات في هذا القسم حاليًا.</div>';
</script>
</body>
</html>
