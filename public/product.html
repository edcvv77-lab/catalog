<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1f542f"><title>تفاصيل المنتج | متجر أم تركي</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="store-shared.css"><link rel="stylesheet" href="premium.css"><link rel="stylesheet" href="showcase.css"><link rel="stylesheet" href="card-images.css"></head><body><header class="site-header"><div class="wrap header-row"><a class="back" href="categories.html">←</a><a class="brand" href="index.html"><span class="leaf">🌿</span><span>متجر أم تركي</span></a><a class="head-action" href="cart.html">🛒<span class="badge cart-count">0</span></a></div></header><main class="wrap"><section class="page-hero"><a href="categories.html">المنتجات ←</a></section><div id="detail"></div><section class="page-hero" style="padding-bottom:14px"><h1 style="font-size:23px">قد يعجبك أيضًا</h1><p>منتجات أخرى من نفس القسم.</p></section><div class="products" id="related"></div></main><nav class="bottom"><a href="index.html"><span>⌂</span>الرئيسية</a><a class="active" href="categories.html"><span>▦</span>الأقسام</a><a href="cart.html"><span>🛒</span>السلة</a><a href="favorites.html"><span>♡</span>المفضلة</a><a href="about.html"><span>ⓘ</span>من نحن</a></nav><script src="store-data.js"></script><script>
const id=Number(new URLSearchParams(location.search).get('id'));const p=productById(id)||storeProducts[0];
function buyNow(){addToCart(p.id);location.href='checkout.html'}function shareProduct(){const url=location.href;if(navigator.share){navigator.share({title:p.name,text:'شاهد هذا المنتج في متجر أم تركي',url}).catch(()=>{})}else{navigator.clipboard?.writeText(url);alert('تم نسخ رابط المنتج')}}
function draw(){const fav=getFav().includes(p.id);document.title=p.name+' | متجر أم تركي';document.getElementById('detail').innerHTML=`<div class="product-detail"><div class="detail-img"><img src="${p.image}" alt="${p.name}"></div><div class="detail-card"><span class="section-label">${storeCategories[p.category].icon} ${categoryName(p.category)}</span><h1>${p.name}</h1><div class="detail-price">${priceText()}</div><p>${p.desc}</p>${p.highlights?.length?`<div class="highlights">${p.highlights.map(x=>`<div class="highlight">✓ ${x}</div>`).join('')}</div>`:''}${p.usage?`<div class="usage-box"><b>طريقة الاستخدام:</b><br>${p.usage}</div>`:''}${p.warning?`<div class="warning-box"><b>تنبيه:</b><br>${p.warning}</div>`:''}<div class="notice">السعر والتوفر يتم تأكيدهما مباشرة مع متجر أم تركي قبل إتمام الطلب.</div><div class="product-actions"><button class="btn" onclick="buyNow()">اطلب الآن</button><button class="btn alt" onclick="addToCart(${p.id});this.textContent='تمت الإضافة ✓'">أضف إلى السلة</button></div><div class="product-actions"><button class="btn outline" onclick="productWhatsApp(${p.id})">اسأل عن السعر عبر واتساب</button><button class="btn outline" onclick="toggleFav(${p.id});draw()">${fav?'إزالة من المفضلة ♥':'إضافة للمفضلة ♡'}</button></div><button class="btn alt full" style="margin-top:9px" onclick="shareProduct()">مشاركة المنتج</button><div class="trust-row"><div class="trust-chip">الدفع عند الاستلام</div><div class="trust-chip">طلب عبر واتساب</div><div class="trust-chip">توصيل حسب المنطقة</div></div></div></div>`}
function drawRelated(){const items=storeProducts.filter(x=>x.category===p.category&&x.id!==p.id).slice(0,4),box=document.getElementById('related');box.innerHTML=items.map(x=>`<article class="product"><a class="product-img" href="product.html?id=${x.id}"><img src="${x.image}" alt="${x.name}" loading="lazy"></a><div class="product-body"><a href="product.html?id=${x.id}"><h3>${x.name}</h3></a><p class="product-short">${x.short}</p><div class="price-contact">${priceText()}</div><button class="btn full" onclick="addToCart(${x.id});this.textContent='تمت الإضافة ✓'">أضف للسلة</button></div></article>`).join('')}draw();drawRelated();
</script><script src="store-experience.js" defer></script><script src="showcase.js" defer></script></body></html>
