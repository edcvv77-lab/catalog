<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تفاصيل المنتج | متجر أم تركي</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="store-shared.css"></head><body>
<header class="site-header"><div class="wrap header-row">
<a class="back" href="index.html" aria-label="رجوع">←</a>
<a class="brand" href="index.html"><span class="leaf">🌿</span><span>متجر أم تركي</span></a>
<a class="head-action" href="cart.html" aria-label="السلة">🛒<span class="badge cart-count">0</span></a>
</div></header><main class="wrap"><section class="page-hero"><a href="categories.html">الأقسام ←</a></section><div id="detail"></div></main>
<nav class="bottom">
<a class="active" href="index.html"><span>⌂</span>الرئيسية</a>
<a class="" href="categories.html"><span>▦</span>الأقسام</a>
<a class="" href="favorites.html"><span>♡</span>المفضلة</a>
<a class="" href="cart.html"><span>🛒</span>السلة</a>
</nav><script src="store-data.js"></script><script>
const id=Number(new URLSearchParams(location.search).get("id")),p=storeProducts.find(x=>x.id===id)||storeProducts[0];
function draw(){let fav=getFav().includes(p.id);document.title=p.name+" | متجر أم تركي";document.getElementById("detail").innerHTML=`<div class="product-detail"><div class="detail-img"><img src="${p.image}" alt="${p.name}"></div><div class="detail-card"><div class="rating">★★★★★ (${p.reviews})</div><h1>${p.name}</h1><div class="detail-price">${money(p.price)}</div><p>${p.desc}</p><div class="notice">ملاحظة: هذه بيانات تجريبية لعرض التصميم. سيتم إدخال المكونات وطريقة الاستخدام والتنبيهات الفعلية لكل منتج لاحقًا.</div><button class="btn full" onclick="addToCart(${p.id});this.textContent='تمت الإضافة إلى السلة ✓'">أضف إلى السلة</button><button class="btn alt full" style="margin-top:10px" onclick="toggleFav(${p.id});draw()">${fav?'إزالة من المفضلة ♥':'إضافة للمفضلة ♡'}</button></div></div>`}draw();
</script></body></html>
