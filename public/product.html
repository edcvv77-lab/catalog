<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#1f542f">
  <title>تفاصيل المنتج | متجر أم تركي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="store-shared.css">
</head>
<body>
<header class="site-header"><div class="wrap header-row">
  <a class="back" href="categories.html" aria-label="رجوع">←</a>
  <a class="brand" href="index.html"><span class="leaf">🌿</span><span>متجر أم تركي</span></a>
  <a class="head-action" href="cart.html" aria-label="السلة">🛒<span class="badge cart-count">0</span></a>
</div></header>

<main class="wrap">
  <section class="page-hero"><a href="categories.html">الأقسام ←</a></section>
  <div id="detail"></div>

  <section class="page-hero" style="padding-bottom:14px">
    <h1 style="font-size:23px">قد يعجبك أيضًا</h1>
    <p>منتجات أخرى من نفس القسم.</p>
  </section>
  <div class="products" id="related"></div>
</main>

<nav class="bottom">
  <a class="" href="index.html"><span>⌂</span>الرئيسية</a>
  <a class="active" href="categories.html"><span>▦</span>الأقسام</a>
  <a class="" href="cart.html"><span>🛒</span>السلة</a>
  <a class="" href="favorites.html"><span>♡</span>المفضلة</a>
  <a class="" href="about.html"><span>ⓘ</span>من نحن</a>
</nav>

<script src="store-data.js"></script>
<script>
const id=Number(new URLSearchParams(location.search).get("id"));
const p=storeProducts.find(x=>x.id===id)||storeProducts[0];

function buyNow(){
  addToCart(p.id);
  location.href="checkout.html";
}
function shareProduct(){
  const url=location.href;
  if(navigator.share){
    navigator.share({title:p.name,text:"شاهد هذا المنتج في متجر أم تركي",url}).catch(()=>{});
  }else{
    navigator.clipboard?.writeText(url);
    alert("تم نسخ رابط المنتج");
  }
}
function draw(){
  const fav=getFav().includes(p.id);
  document.title=p.name+" | متجر أم تركي";
  document.getElementById("detail").innerHTML=`
    <div class="product-detail">
      <div class="detail-img"><img src="${p.image}" alt="${p.name}"></div>
      <div class="detail-card">
        <div class="rating">★★★★★ (${p.reviews})</div>
        <h1>${p.name}</h1>
        <div class="detail-price">${money(p.price)}</div>
        <p>${p.desc}</p>
        <div class="notice">هذه بيانات تجريبية لعرض التصميم. سنضيف لاحقًا المكونات، طريقة الاستخدام، الحجم، والتنبيهات الحقيقية لكل منتج.</div>
        <div class="product-actions">
          <button class="btn" onclick="buyNow()">اشترِ الآن</button>
          <button class="btn alt" onclick="addToCart(${p.id});this.textContent='تمت الإضافة ✓'">أضف إلى السلة</button>
        </div>
        <div class="product-actions">
          <button class="btn alt" onclick="toggleFav(${p.id});draw()">${fav?'إزالة من المفضلة ♥':'إضافة للمفضلة ♡'}</button>
          <button class="btn alt" onclick="shareProduct()">مشاركة المنتج</button>
        </div>
        <div class="trust-row">
          <div class="trust-chip">الدفع عند الاستلام</div>
          <div class="trust-chip">طلب عبر واتساب</div>
          <div class="trust-chip">توصيل حسب المنطقة</div>
        </div>
      </div>
    </div>`;
}
function drawRelated(){
  const items=storeProducts.filter(x=>x.category===p.category&&x.id!==p.id).slice(0,4);
  const box=document.getElementById("related");
  if(!items.length){box.innerHTML='<div class="empty" style="grid-column:1/-1">سنضيف منتجات مشابهة هنا لاحقًا.</div>';return}
  box.innerHTML=items.map(x=>`
    <article class="product">
      <a class="product-img" href="product.html?id=${x.id}"><img src="${x.image}" alt="${x.name}" loading="lazy"></a>
      <div class="product-body">
        <a href="product.html?id=${x.id}"><h3>${x.name}</h3></a>
        <div class="rating">★★★★★ <span>(${x.reviews})</span></div>
        <div class="price">${money(x.price)}</div>
        <button class="btn full" onclick="addToCart(${x.id});this.textContent='تمت الإضافة ✓'">أضف إلى السلة</button>
      </div>
    </article>`).join("");
}
draw();drawRelated();
</script>
</body>
</html>
