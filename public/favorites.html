<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المفضلة | متجر أم تركي</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="store-shared.css"></head><body>
<header class="site-header"><div class="wrap header-row">
<a class="back" href="index.html" aria-label="رجوع">←</a>
<a class="brand" href="index.html"><span class="leaf">🌿</span><span>متجر أم تركي</span></a>
<a class="head-action" href="cart.html" aria-label="السلة">🛒<span class="badge cart-count">0</span></a>
</div></header><main class="wrap"><section class="page-hero"><h1>المفضلة</h1><p>كل المنتجات التي حفظتها ترجع لها بسهولة من هنا.</p></section><div class="products" id="grid"></div></main>
<nav class="bottom">
<a class="" href="index.html"><span>⌂</span>الرئيسية</a>
<a class="" href="categories.html"><span>▦</span>الأقسام</a>
<a class="active" href="favorites.html"><span>♡</span>المفضلة</a>
<a class="" href="cart.html"><span>🛒</span>السلة</a>
</nav><script src="store-data.js"></script><script>
function draw(){let f=getFav(),arr=storeProducts.filter(p=>f.includes(p.id)),g=document.getElementById("grid");if(!arr.length){g.innerHTML='<div class="empty" style="grid-column:1/-1"><h3>المفضلة فارغة</h3><p>اضغط على القلب بجانب أي منتج ليظهر هنا.</p><a class="btn" href="categories.html">استعراض المنتجات</a></div>';return}g.innerHTML=arr.map(p=>`<article class="product"><div class="product-img"><a href="product.html?id=${p.id}"><img src="${p.image}" alt="${p.name}"></a><button class="heart active" onclick="toggleFav(${p.id});draw()">♥</button></div><div class="product-body"><a href="product.html?id=${p.id}"><h3>${p.name}</h3></a><div class="rating">★★★★★ <span>(${p.reviews})</span></div><div class="price">${money(p.price)}</div><button class="btn full" onclick="addToCart(${p.id});this.textContent='تمت الإضافة ✓'">أضف إلى السلة</button></div></article>`).join("")}draw();
</script></body></html>
