<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المفضلة | متجر أم تركي</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="store-shared.css"><link rel="stylesheet" href="premium.css"><link rel="stylesheet" href="showcase.css"><link rel="stylesheet" href="card-images.css"></head><body><header class="site-header"><div class="wrap header-row"><a class="back" href="index.html">←</a><a class="brand" href="index.html"><span class="leaf">🌿</span><span>متجر أم تركي</span></a><a class="head-action" href="cart.html">🛒<span class="badge cart-count">0</span></a></div></header><main class="wrap"><section class="page-hero"><h1>المفضلة</h1><p>المنتجات التي حفظتها للرجوع إليها لاحقًا.</p></section><div class="products" id="grid"></div></main><nav class="bottom"><a href="index.html"><span>⌂</span>الرئيسية</a><a href="categories.html"><span>▦</span>الأقسام</a><a href="cart.html"><span>🛒</span>السلة</a><a class="active" href="favorites.html"><span>♡</span>المفضلة</a><a href="about.html"><span>ⓘ</span>من نحن</a></nav><script src="store-data.js"></script><script>
const favoritesGrid=document.getElementById('grid');
const favoritesCount=document.createElement('p');
favoritesCount.className='favorites-count';
favoritesCount.setAttribute('role','status');
favoritesGrid.before(favoritesCount);
const favoriteNumbers=new Intl.NumberFormat('ar',{numberingSystem:'arab'});
function draw(){
  const saved=getFav(),items=storeProducts.filter(p=>saved.includes(p.id));
  favoritesCount.textContent='محفوظة: '+favoriteNumbers.format(items.length);
  if(!items.length){
    favoritesGrid.innerHTML='<div class="empty favorite-empty"><div aria-hidden="true">♡</div><h2>المفضلة فارغة.</h2><p>اضغطي على القلب بجانب أي منتج، وبتلقينه هنا لما ترجعين.</p><a class="btn" href="categories.html">تصفّحي المنتجات ←</a></div>';
    return;
  }
  favoritesGrid.innerHTML=items.map(p=>`<article class="product"><div class="product-img"><a href="product.html?id=${p.id}"><img src="${p.image}" alt="${p.name}" loading="lazy"></a><button type="button" class="heart active" data-remove-fav="${p.id}" aria-label="إزالة ${p.name} من المفضلة">♥</button></div><div class="product-body"><a href="product.html?id=${p.id}"><h3>${p.name}</h3></a><p class="product-short">${p.short}</p><div class="price-contact">${priceText()}</div><div class="product-actions-mini"><button type="button" class="btn" onclick="addToCart(${p.id});this.textContent='تمت الإضافة ✓'">أضف للسلة</button><button type="button" class="btn alt ask-mini" aria-label="اسألي عن السعر عبر واتساب" onclick="productWhatsApp(${p.id})">💬</button></div></div></article>`).join('');
}
favoritesGrid.addEventListener('click',event=>{
  const control=event.target.closest('[data-remove-fav]');
  if(!control)return;
  const controls=[...favoritesGrid.querySelectorAll('[data-remove-fav]')];
  const index=controls.indexOf(control);
  toggleFav(Number(control.dataset.removeFav));
  draw();
  const updated=favoritesGrid.querySelectorAll('[data-remove-fav]');
  (updated[Math.min(index,updated.length-1)]||favoritesGrid.querySelector('.favorite-empty a'))?.focus();
});
draw();
</script><script src="store-experience.js" defer></script><script src="showcase.js" defer></script><script src="cinema-commerce.js?v=2" defer></script></body></html>
