<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>السلة | متجر أم تركي</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="store-shared.css"><link rel="stylesheet" href="premium.css"><link rel="stylesheet" href="showcase.css"><link rel="stylesheet" href="card-images.css"></head><body><header class="site-header"><div class="wrap header-row"><a class="back" href="index.html">←</a><a class="brand" href="index.html"><span class="leaf">🌿</span><span>متجر أم تركي</span></a><a class="head-action" href="cart.html">🛒<span class="badge cart-count">0</span></a></div></header><main class="wrap"><section class="page-hero"><h1>سلة التسوق</h1><p>راجع المنتجات والكميات. السعر النهائي لكل منتج ورسوم التوصيل يتم تأكيدهما مع المتجر عبر واتساب.</p></section><div id="cartList" class="cart-list"></div><div class="summary" id="summary"><div class="summary-line"><span>عدد القطع</span><strong id="pieces">0</strong></div><div class="summary-line total"><span>الأسعار</span><strong>تُؤكد عند التواصل</strong></div><a class="btn full" style="display:block;text-align:center" href="checkout.html">متابعة لإتمام الطلب</a><div style="margin-top:9px;text-align:center;font-size:12px;color:var(--muted)">لن يتم احتساب مبلغ وهمي داخل المتجر؛ ستحصل على السعر الصحيح عند تأكيد الطلب.</div></div></main><nav class="bottom"><a href="index.html"><span>⌂</span>الرئيسية</a><a href="categories.html"><span>▦</span>الأقسام</a><a class="active" href="cart.html"><span>🛒</span>السلة</a><a href="favorites.html"><span>♡</span>المفضلة</a><a href="about.html"><span>ⓘ</span>من نحن</a></nav><script src="store-data.js"></script><script>
function change(id,d){let c=getCart(),i=c.find(x=>x.id===id);if(!i)return;i.qty+=d;if(i.qty<=0)c=c.filter(x=>x.id!==id);saveCart(c);updateBadges();draw()}function removeItem(id){saveCart(getCart().filter(x=>x.id!==id));updateBadges();draw()}
function draw(){const c=getCart(),box=document.getElementById('cartList');let pieces=0;if(!c.length){box.innerHTML='<div class="empty"><h3>سلتك فارغة</h3><p>ابدأ من الأقسام وأضف المنتجات التي تريدها.</p><a class="btn" href="categories.html">تصفح المنتجات</a></div>';document.getElementById('summary').style.display='none';return}document.getElementById('summary').style.display='block';box.innerHTML=c.map(i=>{const p=productById(i.id);if(!p)return'';pieces+=i.qty;return `<div class="cart-row"><a href="product.html?id=${p.id}"><img src="${p.image}" alt="${p.name}"></a><div><h3>${p.name}</h3><div class="price-contact">${priceText()}</div><div class="qty"><button onclick="change(${p.id},1)">+</button><b>${i.qty}</b><button onclick="change(${p.id},-1)">−</button></div></div><button class="remove" onclick="removeItem(${p.id})">×</button></div>`}).join('');document.getElementById('pieces').textContent=pieces}draw();
</script><script src="store-experience.js" defer></script><script src="showcase.js" defer></script></body></html>
