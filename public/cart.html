<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>السلة | متجر أم تركي</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="store-shared.css"></head><body>
<header class="site-header"><div class="wrap header-row">
<a class="back" href="index.html" aria-label="رجوع">←</a>
<a class="brand" href="index.html"><span class="leaf">🌿</span><span>متجر أم تركي</span></a>
<a class="head-action" href="cart.html" aria-label="السلة">🛒<span class="badge cart-count">0</span></a>
</div></header><main class="wrap"><section class="page-hero"><h1>سلة التسوق</h1><p>راجعي المنتجات والكميات قبل إرسال الطلب عبر واتساب.</p></section><div id="cartList" class="cart-list"></div><div class="summary" id="summary"><div class="summary-line"><span>عدد القطع</span><strong id="pieces">0</strong></div><div class="summary-line total"><span>الإجمالي</span><strong id="total">0 ر.ي</strong></div><a class="btn full" style="display:block;text-align:center" href="checkout.html">متابعة لإتمام الطلب</a><div style="margin-top:9px;text-align:center;font-size:12px;color:var(--muted)">راجع بيانات التوصيل وطريقة الدفع قبل إرسال الطلب.</div></div></main>
<nav class="bottom">
<a class="" href="index.html"><span>⌂</span>الرئيسية</a>
<a class="" href="categories.html"><span>▦</span>الأقسام</a>
<a class="" href="favorites.html"><span>♡</span>المفضلة</a>
<a class="active" href="cart.html"><span>🛒</span>السلة</a>
</nav><script src="store-data.js"></script><script>
function change(id,d){let c=getCart(),i=c.find(x=>x.id===id);if(!i)return;i.qty+=d;if(i.qty<=0)c=c.filter(x=>x.id!==id);saveCart(c);updateBadges();draw()}
function removeItem(id){saveCart(getCart().filter(x=>x.id!==id));updateBadges();draw()}
function draw(){let c=getCart(),box=document.getElementById("cartList"),total=0,pieces=0;if(!c.length){box.innerHTML='<div class="empty"><h3>سلتك فارغة</h3><p>ابدأ من الأقسام وأضف المنتجات التي تريدها.</p><a class="btn" href="categories.html">تصفح الأقسام</a></div>';document.getElementById("summary").style.display="none";return}document.getElementById("summary").style.display="block";box.innerHTML=c.map(i=>{let p=storeProducts.find(x=>x.id===i.id);total+=p.price*i.qty;pieces+=i.qty;return `<div class="cart-row"><img src="${p.image}" alt="${p.name}"><div><h3>${p.name}</h3><div class="price">${money(p.price)}</div><div class="qty"><button onclick="change(${p.id},1)">+</button><b>${i.qty}</b><button onclick="change(${p.id},-1)">−</button></div></div><button class="remove" onclick="removeItem(${p.id})">×</button></div>`}).join("");document.getElementById("pieces").textContent=pieces;document.getElementById("total").textContent=money(total)}draw();
</script></body></html>
